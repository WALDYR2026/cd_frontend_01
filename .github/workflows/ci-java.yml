name: CI - Frontend Java
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y probar
        run: mvn --batch-mode clean verify
      - name: Guardar JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: frontend-java-jar
          path: target/*.jar
